<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MCHTML v2.0</title>
<style>
/* ---------- base ---------- */
*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000;
  font-family:'Courier New', ui-monospace, monospace; color:#e8e8e8; user-select:none; }
.hidden{ display:none !important; }
#view{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
img{ image-rendering: pixelated; }
button{ font-family:inherit; }

/* ---------- generic screens ---------- */
.screen{ position:fixed; inset:0; z-index:40; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px; padding:24px;
  background:rgba(8,10,16,.90); overflow:auto; }
.btn{ display:block; width:280px; max-width:88vw; padding:12px 16px; text-align:center;
  background:#2a2f3a; color:#eee; border:2px solid #565b66; cursor:pointer; font-size:15px;
  letter-spacing:.5px; }
.btn:hover{ background:#3a4150; border-color:#8a92a2; }
.btn.small{ width:auto; padding:6px 12px; font-size:13px; }
.btn.danger{ border-color:#8a4a4a; color:#f0b0b0; }
.btn.danger:hover{ background:#4a2a2a; }
h1{ font-size:52px; margin:8px 0 2px; color:#8ee06a; letter-spacing:3px;
  text-shadow:3px 3px 0 #23401c, 6px 6px 0 rgba(0,0,0,.55); }
h2{ color:#ffd76e; margin:14px 0 4px; }
.sub{ color:#9aa4b4; margin-bottom:14px; font-size:13px; }
.foot{ position:fixed; bottom:10px; left:0; right:0; text-align:center; color:#6b7482; font-size:12px; }
input[type=text]{ width:280px; max-width:88vw; padding:10px; background:#14171d; color:#eee;
  border:2px solid #565b66; font-family:inherit; font-size:15px; }
textarea{ width:min(640px,92vw); height:74px; background:#14171d; color:#cde;
  border:2px solid #565b66; font-family:inherit; font-size:11px; resize:none; }
select{ padding:8px; background:#14171d; color:#eee; border:2px solid #565b66; font-family:inherit; }
label.chk{ display:flex; gap:8px; align-items:center; font-size:14px; }
.wrow{ display:flex; align-items:center; gap:10px; width:min(480px,92vw); padding:10px 12px;
  background:#1c2029; border:2px solid #3a4150; }
.wrow .winfo{ flex:1; display:flex; flex-direction:column; }
.wrow .winfo b{ font-size:15px; }
.wrow .winfo span{ color:#8a93a3; font-size:11px; }
.empty{ color:#77808e; padding:12px; }
#worldsList{ display:flex; flex-direction:column; gap:8px; max-height:52vh; overflow:auto; }
#howto{ max-width:720px; text-align:left; }
#howtoBody{ font-size:13px; line-height:1.55; color:#c9d2e0; }
#howtoBody p{ margin:6px 0; }
#loadBarWrap{ width:min(420px,86vw); height:22px; border:2px solid #565b66; background:#14171d; }
#loadBar{ height:100%; width:0%; background:linear-gradient(90deg,#5a8f3c,#8ee06a); transition:width .2s; }
.settingsRow{ display:flex; align-items:center; gap:12px; width:min(420px,90vw); justify-content:space-between; }

/* ---------- HUD ---------- */
#hud{ position:fixed; inset:0; z-index:10; pointer-events:none; }
#crosshair{ position:absolute; left:50%; top:50%; width:18px; height:18px;
  transform:translate(-50%,-50%); opacity:.85; }
#crosshair::before,#crosshair::after{ content:''; position:absolute; background:#e8e8e8;
  mix-blend-mode:difference; }
#crosshair::before{ left:8px; top:0; width:2px; height:18px; }
#crosshair::after{ left:0; top:8px; width:18px; height:2px; }
#debug{ position:absolute; left:8px; top:6px; font-size:11px; color:#d6e0f0;
  text-shadow:1px 1px 0 #000; white-space:pre; }
#hearts{ position:absolute; left:50%; bottom:66px; transform:translateX(-50%);
  font-size:19px; letter-spacing:2px; }
#hearts span{ color:#e23b3b; text-shadow:1px 1px 0 #000, 0 0 2px #000; }
#hearts .empty{ color:#3a3a3a; }
#hearts .half{ background:linear-gradient(90deg,#e23b3b 50%,#3a3a3a 50%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:none; filter:drop-shadow(1px 1px 0 #000); }
#air{ position:absolute; left:50%; bottom:92px; transform:translateX(-50%);
  font-size:15px; color:#7ec8ff; text-shadow:1px 1px 0 #000; letter-spacing:3px; }
#hotbar{ position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
  display:flex; gap:4px; pointer-events:auto; }
.hslot{ width:46px; height:46px; position:relative; background:rgba(20,23,29,.72);
  border:2px solid #565b66; cursor:pointer; }
.hslot.sel{ border-color:#ffffff; box-shadow:0 0 0 1px #000 inset; }
.hslot img{ position:absolute; left:50%; top:50%; width:36px; height:36px;
  transform:translate(-50%,-50%); }
.cnt{ position:absolute; right:2px; bottom:0; font-size:12px; font-weight:bold; color:#fff;
  text-shadow:1px 1px 0 #000; }
#toasts{ position:absolute; left:50%; bottom:120px; transform:translateX(-50%);
  display:flex; flex-direction:column; gap:6px; align-items:center; }
.toast{ background:rgba(10,12,18,.78); border:1px solid #4a5160; padding:7px 14px;
  font-size:13px; color:#ffe; transition:opacity .5s; }
.toast.fade{ opacity:0; }
#hurtFlash{ position:absolute; inset:0; opacity:0; transition:opacity .22s;
  background:radial-gradient(ellipse at center, rgba(160,20,20,0) 40%, rgba(160,20,20,.55) 100%); }
#hurtFlash.on{ opacity:1; }

/* ---------- overlays (inventory / craft / furnace) ---------- */
.overlay{ position:fixed; inset:0; z-index:30; display:flex; align-items:center;
  justify-content:center; background:rgba(0,0,0,.55); }
.panel{ background:#2b2f38; border:3px solid #565b66; padding:16px; max-height:94vh;
  overflow:auto; }
.panel h3{ margin:0 0 10px; font-size:15px; color:#ffd76e; letter-spacing:1px; }
.grid3,.grid2{ display:grid; grid-template-columns:repeat(3,46px); gap:4px; }
.grid2{ grid-template-columns:repeat(2,46px); }
.grid9{ display:grid; grid-template-columns:repeat(9,46px); gap:4px; }
.slot{ width:46px; height:46px; position:relative; background:#1c2029; border:2px solid #4a5160;
  cursor:pointer; }
.slot:hover{ border-color:#9aa4b4; }
.slot img{ position:absolute; left:50%; top:50%; width:36px; height:36px;
  transform:translate(-50%,-50%); pointer-events:none; }
.slot.result{ border-color:#8a7a3a; background:#33301e; }
.slot.pal{ background:#232833; }
.slot .xmark{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#e07070; font-size:18px; }
.invGrids{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }
.craftRow{ display:flex; align-items:center; gap:14px; }
.arrow{ font-size:26px; color:#9aa4b4; }
.palGrid{ display:grid; grid-template-columns:repeat(9,46px); gap:4px; }
.flameWrap{ width:20px; height:20px; position:relative; background:#14171d;
  border:1px solid #4a5160; align-self:end; }
#furnFlame{ position:absolute; bottom:0; left:0; right:0; height:0%;
  background:linear-gradient(0deg,#e8720f,#ffd76e); }
.arrowFillWrap{ width:64px; height:12px; position:relative; background:#14171d;
  border:1px solid #4a5160; }
#furnArrowFill{ position:absolute; left:0; top:0; bottom:0; width:0%;
  background:#8ee06a; }
.furnRow{ display:flex; align-items:center; gap:12px; }
#cursorItem{ position:fixed; z-index:100; width:44px; height:44px; pointer-events:none; }
#cursorItem img{ position:absolute; left:50%; top:50%; width:36px; height:36px;
  transform:translate(-50%,-50%); }
#cursorItem .cnt{ position:absolute; right:0; bottom:-2px; font-size:12px; font-weight:bold;
  color:#fff; text-shadow:1px 1px 0 #000; }

/* ---------- touch controls ---------- */
#touchRoot{ position:fixed; inset:0; z-index:5; pointer-events:none; }
#stickZone{ position:absolute; left:18px; bottom:70px; width:130px; height:130px;
  border:2px solid rgba(255,255,255,.25); border-radius:50%; background:rgba(255,255,255,.06);
  pointer-events:auto; touch-action:none; }
#stickKnob{ position:absolute; left:50%; top:50%; width:52px; height:52px;
  border-radius:50%; background:rgba(255,255,255,.28); transform:translate(-50%,-50%); }
#lookZone{ position:absolute; right:0; top:0; width:62%; height:100%;
  pointer-events:auto; touch-action:none; }
#touchBtns .tbtn{ position:absolute; padding:12px 14px; font-size:13px; font-weight:bold;
  background:rgba(20,23,29,.55); color:#eee; border:2px solid rgba(255,255,255,.3);
  pointer-events:auto; touch-action:none; user-select:none; }
#btnJump{ right:18px; bottom:78px; border-radius:50%; width:74px; height:74px; }
#btnDown{ right:104px; bottom:78px; border-radius:50%; width:58px; height:58px; }
#btnFly{ right:18px; bottom:170px; }
#btnMode{ right:18px; bottom:230px; border-color:rgba(255,215,110,.55); }
#btnMenu{ right:18px; top:14px; }
@media (max-width:760px){
  #hotbar .hslot{ width:40px; height:40px; }
  .grid9{ grid-template-columns:repeat(9,40px); }
  .palGrid{ grid-template-columns:repeat(6,46px); }
  .slot{ width:40px; height:40px; }
  .grid3,.grid2{ grid-template-columns:repeat(3,40px); }
  h1{ font-size:38px; }
}
</style>
</head>
<body>
<canvas id="view"></canvas>

<!-- ================= HUD ================= -->
<div id="hud" class="hidden">
  <div id="hurtFlash"></div>
  <div id="crosshair"></div>
  <div id="debug"></div>
  <div id="air"></div>
  <div id="hearts"></div>
  <div id="toasts"></div>
  <div id="hotbar"></div>
</div>

<!-- ================= touch ================= -->
<div id="touchRoot" class="hidden">
  <div id="lookZone"></div>
  <div id="stickZone"><div id="stickKnob"></div></div>
  <div id="touchBtns">
    <button class="tbtn" id="btnJump">JUMP</button>
    <button class="tbtn" id="btnDown">▼</button>
    <button class="tbtn" id="btnFly">FLY</button>
    <button class="tbtn" id="btnMode">MINE</button>
    <button class="tbtn" id="btnMenu">MENU</button>
  </div>
</div>

<!-- ================= screens ================= -->
<div id="title" class="screen hidden">
  <h1>MCHTML</h1>
  <div class="sub">v2.0 — the survival update</div>
  <button class="btn" id="btnPlay">Play</button>
  <button class="btn" id="btnHow">How to Play</button>
  <div class="foot" id="titleFooter"></div>
</div>

<div id="worlds" class="screen hidden">
  <h2>Your Worlds</h2>
  <div id="worldsList"></div>
  <button class="btn" id="btnWorldCreate">Create New World</button>
  <button class="btn" id="btnWorldsBack">Back</button>
</div>

<div id="create" class="screen hidden">
  <h2>Create New World</h2>
  <input type="text" id="cName" maxlength="24" placeholder="World name">
  <input type="text" id="cSeed" placeholder="Seed (blank = random)">
  <label class="chk"><input type="radio" id="cModeCreative" name="cmode" checked> Creative</label>
  <label class="chk"><input type="radio" id="cModeSurvival" name="cmode"> Survival</label>
  <button class="btn" id="btnCreateGo">Create</button>
  <button class="btn" id="btnCreateBack">Back</button>
</div>

<div id="loading" class="screen hidden">
  <h2 id="loadText">generating terrain…</h2>
  <div id="loadBarWrap"><div id="loadBar"></div></div>
</div>

<div id="pause" class="screen hidden">
  <h2>Paused</h2>
  <div class="sub" id="pauseSeed"></div>
  <button class="btn" id="btnResume">Resume</button>
  <button class="btn" id="btnSave">Save Now</button>
  <button class="btn" id="btnSeed">Copy Seed</button>
  <button class="btn" id="btnMp">Multiplayer</button>
  <button class="btn" id="btnSettings">Settings</button>
  <button class="btn" id="btnHow2">How to Play</button>
  <button class="btn" id="btnMainMenu">Save &amp; Main Menu</button>
</div>

<div id="settings" class="screen hidden">
  <h2>Settings</h2>
  <div class="settingsRow"><span>Mouse sensitivity</span>
    <span><input type="range" id="sensRange" min="0.2" max="2" step="0.1" style="width:160px">
    <b id="sensVal">1.0</b></span></div>
  <label class="chk"><input type="checkbox" id="invertY"> Invert Y axis</label>
  <div class="settingsRow"><span>Render distance</span>
    <select id="distSel">
      <option value="2">2 chunks</option><option value="3">3 chunks</option>
      <option value="4" selected>4 chunks</option><option value="5">5 chunks</option>
      <option value="6">6 chunks</option>
    </select></div>
  <button class="btn" id="btnSettingsBack">Back</button>
</div>

<div id="howto" class="screen hidden">
  <h2>How to Play</h2>
  <div id="howtoBody"></div>
  <button class="btn" id="btnHowBack">Back</button>
</div>

<div id="mp" class="screen hidden">
  <h2>Multiplayer</h2>
  <div class="sub" id="mpStatus">offline · works by pasting codes between players (no server)</div>
  <button class="btn" id="btnMpHost">Host — make invite code</button>
  <textarea id="mpOffer" readonly placeholder="your invite code appears here"></textarea>
  <button class="btn small" id="btnMpCopyOffer">Copy invite code</button>
  <textarea id="mpAnswerIn" placeholder="paste your friend's reply code here"></textarea>
  <button class="btn small" id="btnMpReply">Accept reply</button>
  <hr style="width:min(480px,90vw); border-color:#3a4150;">
  <textarea id="mpJoinCode" placeholder="paste your friend's invite code here"></textarea>
  <button class="btn" id="btnMpJoin">Join — make reply code</button>
  <textarea id="mpAnswerOut" readonly placeholder="your reply code appears here"></textarea>
  <button class="btn small" id="btnMpCopyAnswer">Copy reply code</button>
  <button class="btn" id="btnMpLeave">Leave</button>
  <button class="btn" id="btnMpBack">Back</button>
</div>

<div id="death" class="screen hidden" style="background:rgba(90,10,10,.55)">
  <h1 style="color:#ff6a6a; text-shadow:3px 3px 0 #401010">You died!</h1>
  <button class="btn" id="btnRespawn">Respawn</button>
  <button class="btn" id="btnDeathMenu">Main Menu</button>
</div>

<!-- ================= overlays ================= -->
<div id="invOverlay" class="overlay hidden">
  <div class="panel">
    <h3>Inventory</h3>
    <div id="invTop"></div>
    <div class="invGrids">
      <div id="invGrid" class="grid9"></div>
      <div id="invHotbar" class="grid9"></div>
    </div>
  </div>
</div>

<div id="craftOverlay" class="overlay hidden">
  <div class="panel">
    <h3>Crafting Table</h3>
    <div class="craftRow">
      <div id="craftGrid3" class="grid3"></div>
      <div class="arrow">➜</div>
      <div id="craftResult3" class="slot result"></div>
    </div>
    <div class="invGrids">
      <div id="craftInvGrid" class="grid9"></div>
      <div id="craftHotbar" class="grid9"></div>
    </div>
  </div>
</div>

<div id="furnaceOverlay" class="overlay hidden">
  <div class="panel">
    <h3>Furnace</h3>
    <div class="furnRow">
      <div style="display:flex; flex-direction:column; gap:8px; align-items:center">
        <div id="furnIn"></div>
        <div class="flameWrap"><div id="furnFlame"></div></div>
        <div id="furnFuel"></div>
      </div>
      <div class="arrowFillWrap"><div id="furnArrowFill"></div></div>
      <div id="furnOut" class="slot result" style="width:52px;height:52px"></div>
    </div>
    <div class="invGrids">
      <div id="furnInvGrid" class="grid9"></div>
      <div id="furnHotbar" class="grid9"></div>
    </div>
  </div>
</div>

<div id="cursorItem" class="hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="js/data.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/mp.js"></script>
</body>
</html>
